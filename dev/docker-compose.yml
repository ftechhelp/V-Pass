# Local Nextcloud 35 for developing V-Pass.
#   make dev-up     → http://localhost:8080  (admin / admin, alice / alice-vpass-dev, bob / bob-vpass-dev)
# The app folder is bind-mounted, so `npm run dev` rebuilds are picked up on reload.
name: vpass-dev

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: nextcloud
    volumes:
      - db:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  nextcloud:
    image: nextcloud:35-apache
    restart: unless-stopped
    depends_on: [db, redis]
    ports:
      - "8080:80"
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: nextcloud
      REDIS_HOST: redis
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: admin
      NEXTCLOUD_TRUSTED_DOMAINS: localhost 127.0.0.1
      PHP_UPLOAD_LIMIT: 128M
    volumes:
      - nextcloud:/var/www/html
      - ../nextcloud-app:/var/www/html/custom_apps/vpass

volumes:
  db:
  nextcloud:
